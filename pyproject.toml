[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "giavlm"
version = "0.1.0"
description = "Protocol-first gradient leakage benchmark for federated vision-language models"
requires-python = ">=3.10"
dependencies = [
  "torch==2.6.0", "torchvision==0.21.0", "transformers==4.51.3",
  "peft==0.15.2", "hydra-core==1.3.2", "safetensors==0.5.3",
  "numpy==2.2.6", "Pillow==11.2.1", "scipy==1.15.3",
  "rouge-score==0.1.2", "scikit-image==0.25.2",
]

[project.optional-dependencies]
metrics = ["lpips==0.1.4"]
utility = ["pycocoevalcap==1.2"]
dev = ["pytest==8.3.5", "ruff==0.11.13"]

[project.scripts]
fedvlm-gia = "core.experiment:main"

[tool.hatch.build.targets.wheel]
packages = ["core", "attacks", "defenses", "metrics", "evaluation", "utils", "configs", "examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
