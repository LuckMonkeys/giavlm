# Local docs site: mkdocs serve (see requirements-docs.txt). Never deploy publicly:
# experiment pages may quote private token pieces.
site_name: GIAVLM Notebook
site_description: FedVLM gradient-inversion benchmark — state, experiments and protocol
docs_dir: docs
exclude_docs: |
  ppt/
  includes/
  experiments/examples/**/*.md
strict: true
hooks:
  - utils/mkdocs_hooks.py

nav:
  - Home: index.md
  - Handoff: PROJECT_HANDOFF.md
  - Experiments: experiments/README.md  # expanded by utils/mkdocs_hooks.py
  - Methodology:
      - methodology/README.md
      - 优化类方法: methodology/optimization.md
      - DAGER 文本恢复:
          - methodology/dager/README.md
          - Raw 对照: methodology/dager/raw.md
          - Residual v1（当前方案）: methodology/dager/residual-v1.md
          - 纯文本语言先验（实验变体）: methodology/dager/text-prior.md
          - 候选改进与验证状态: methodology/dager/refinements.md
      - 方案迭代模板: methodology/iteration-template.md
  - 术语表: glossary.md
  - Reference:
      - Protocol: protocol.md
      - Validation: validation.md
      - Baselines: baselines.md
      - Architecture (中文): project_architecture.md
      - Learning roadmap: learning_roadmap.md
      - Plans: plans/  # expanded by utils/mkdocs_hooks.py

theme:
  name: material
  custom_dir: overrides
  language: zh
  # System fonts instead of Google Fonts: the site is local-only and CJK text needs a
  # CJK font stack anyway (see stylesheets/extra.css).
  font: false
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - content.code.copy
    - content.tooltips
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode

plugins:
  # jieba segments Chinese (Material uses it when installed). Without the stemmer a fully
  # typed word such as "residual" still matches; the stemmed index would hold "residu".
  - search:
      lang: [zh, en]
      pipeline: [trimmer]

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/table-filter.js
  - javascripts/page-width.js
  - javascripts/editor.js  # in-browser editing, active only under a loopback `mkdocs serve`

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      # The right-hand contents lists research questions (###); #### details keep anchors.
      toc_depth: 3
  - pymdownx.details
  # Material icons in Markdown (`:material-text-search:`), used by the home page cards.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      auto_append:
        - docs/includes/abbreviations.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
